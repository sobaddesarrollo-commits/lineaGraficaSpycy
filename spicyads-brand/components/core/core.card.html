<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../../styles.css" />
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  body { margin: 0; padding: 28px; background: var(--bg-page); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 22px; }
  .sub { font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--text-muted); margin: 0 0 10px; }
</style>

<body>
<div id="root"></div>
<script type="text/babel">
const { Button, Badge, Eyebrow, Input, Card, Switch, Stat, Avatar } = window.SpicyAdsDesignSystem_ec6a90;
const Arrow = () => <span style={{fontWeight:900}}>&rarr;</span>;

function Demo() {
  const [on, setOn] = React.useState(true);
  return (
    <div>
      <p className="sub">Buttons</p>
      <div className="row">
        <Button variant="primary" iconRight={<Arrow/>}>Pide tu propuesta</Button>
        <Button variant="solid">Empieza ya</Button>
        <Button variant="secondary">Ver casos</Button>
        <Button variant="ghost">Saber más</Button>
        <Button variant="dark">Login</Button>
        <Button variant="primary" size="sm">Small</Button>
        <Button variant="secondary" disabled>Disabled</Button>
      </div>

      <p className="sub">Badges</p>
      <div className="row">
        <Badge tone="spice" variant="solid">Nuevo</Badge>
        <Badge tone="spice">Destacado</Badge>
        <Badge tone="success">Activa</Badge>
        <Badge tone="warning">Pendiente</Badge>
        <Badge tone="info">Beta</Badge>
        <Badge tone="neutral">Borrador</Badge>
      </div>

      <p className="sub">Eyebrow · Switch · Avatars</p>
      <div className="row">
        <Eyebrow>Servicios</Eyebrow>
        <Switch checked={on} onChange={setOn} label="Informe mensual" />
        <Avatar name="Lucía Pérez" ring />
        <Avatar name="Marco Ruiz" />
      </div>

      <p className="sub">Input · Stat · Card</p>
      <div className="row" style={{alignItems:'stretch'}}>
        <div style={{width:220}}>
          <Input label="Email" placeholder="hola@tuempresa.com" helper="Respondemos en 24h" />
        </div>
        <Card variant="default" pad="md" hover style={{flex:'none'}}>
          <Stat label="ROAS medio" value="6.4x" trend={{dir:'up', value:'+18%'}} sublabel="90 días" />
        </Card>
        <Card variant="dark" pad="md" style={{flex:'none'}}>
          <Stat tone="spice" value="+312%" label="Leads" align="left" />
        </Card>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
